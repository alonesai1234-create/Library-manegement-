<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Management System</title><link rel="stylesheet" href="style.css"></head><body><div id="login"><div class="card"><h1>📚 Library Management</h1><input id="username" value="admin" placeholder="Username"><input id="password" value="admin123" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div></div><div id="app" class="hide"><header><b>📚 Library Management System</b><span id="who"></span><button onclick="logout()">Logout</button></header><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('books')">Books</button><button onclick="show('members')">Members</button><button onclick="show('loans')">Issue / Return</button></nav><main><section id="dashboard"><h2>Dashboard</h2><div class="stats"><div><b id="bc">0</b>Books</div><div><b id="mc">0</b>Active Members</div><div><b id="ic">0</b>Issued</div><div><b id="oc">0</b>Overdue</div></div></section><section id="books" class="hide"><h2>Books <button onclick="bookForm()">+ Add</button></h2><input id="bs" oninput="renderBooks()" placeholder="Search books"><div id="bf"></div><div id="bt"></div></section><section id="members" class="hide"><h2>Members <button onclick="memberForm()">+ Add</button></h2><input id="ms" oninput="renderMembers()" placeholder="Search members"><div id="mf"></div><div id="mt"></div></section><section id="loans" class="hide"><h2>Issue / Return <button onclick="issueForm()">+ Issue</button></h2><div id="if"></div><div id="lt"></div></section></main></div><script src="app.js"></script></body></html>
